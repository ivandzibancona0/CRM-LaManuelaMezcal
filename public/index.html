<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM La Manuela Mezcal – Gestión de Prospectos, Clientes y Ventas</title>
  <meta name="description" content="Sistema CRM Web Oficial de La Manuela Mezcal. Gestión integral de prospectos, clientes, ventas y seguimientos de equipo comercial.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://lamanuelamezcal.com/imagenes/logos/favicon.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- 🧭 HEADER & NAVIGATION BAR                 -->
  <!-- ========================================== -->
  <header class="app-header" id="app-header" style="display: none;">
    <div class="header-inner">
      <!-- Brand Logo -->
      <a href="#" class="brand-logo-wrap" onclick="app.navigate('dashboard'); return false;">
        <img src="https://lamanuelamezcal.com/imagenes/logos/logos%20web%20la%20manuela-06.png" alt="La Manuela Logo" class="brand-logo-img">
        <div>
          <span class="brand-title">LA MANUELA <span class="text-gold">CRM</span></span>
          <span class="brand-sub">SISTEMA MEZCALERO</span>
        </div>
      </a>

      <!-- Desktop Tab Menu Bar (>= 768px) -->
      <nav class="desktop-nav-tabs" id="desktop-nav-tabs">
        <!-- Rendered dynamically by JS based on user role -->
      </nav>

      <!-- Desktop User Profile & Logout -->
      <div class="desktop-user-wrap">
        <div class="user-info-text">
          <div class="user-name-display" id="user-name-header">Usuario</div>
          <div id="user-role-header"></div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="auth.logout()" title="Cerrar Sesión">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <!-- Hamburger Button for Mobile (< 768px) -->
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir Menú de Navegación">
        <span class="hamburger-bar bar-1"></span>
        <span class="hamburger-bar bar-2"></span>
        <span class="hamburger-bar bar-3"></span>
      </button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 📱 MOBILE NAV DRAWER & BACKDROP            -->
  <!-- ========================================== -->
  <div class="mobile-drawer-backdrop" id="mobile-backdrop"></div>
  <div class="mobile-nav-drawer" id="mobile-drawer">
    <div class="mobile-user-profile">
      <div class="mobile-user-avatar" id="mobile-avatar">U</div>
      <div>
        <div style="font-weight: 700; color: #fff;" id="mobile-user-name">Usuario</div>
        <div id="mobile-user-role"></div>
      </div>
    </div>
    <ul class="mobile-nav-list" id="mobile-nav-list">
      <!-- Rendered dynamically by JS -->
    </ul>
    <div style="margin-top: auto; padding-top: 20px;">
      <button class="btn btn-danger btn-sm" style="width: 100%; justify-content: center;" onclick="auth.logout()">
        <i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 📱 MOBILE QUICK BOTTOM TOUCH BAR          -->
  <!-- ========================================== -->
  <nav class="mobile-bottom-bar" id="mobile-bottom-bar" style="display: none;">
    <!-- Rendered dynamically by JS -->
  </nav>

  <!-- ========================================== -->
  <!-- 💻 MAIN DYNAMIC VIEW CONTAINER             -->
  <!-- ========================================== -->
  <main class="main-content" id="view-container">
    <!-- Dynamic views injected here -->
  </main>

  <!-- ========================================== -->
  <!-- 📦 MODAL ROOT & TOAST NOTIFICATIONS        -->
  <!-- ========================================== -->
  <div id="modal-root"></div>
  <div id="toast-container"></div>

  <!-- JavaScript Application Modules -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/login.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/prospects.js"></script>
  <script src="js/components/clients.js"></script>
  <script src="js/components/sales.js"></script>
  <script src="js/components/followups.js"></script>
  <script src="js/components/reports.js"></script>
  <script src="js/components/products.js"></script>
  <script src="js/components/users.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
