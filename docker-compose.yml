version: '3.8'

services:
  # ==========================================
  # Servidor de Base de Datos MySQL 8.0
  # ==========================================
  db:
    image: mysql:8.0
    container_name: crm_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: crm_la_manuela
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password_segura
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crm-network

  # ==========================================
  # Aplicación CRM La Manuela Mezcal (Node.js)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_la_manuela_app
    restart: unless-stopped
    depends_on:
      - db
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=la_manuela_mezcal_docker_jwt_key_2026
      # Parámetros de conexión a MySQL
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=crm_user
      - DB_PASSWORD=crm_password_segura
      - DB_NAME=crm_la_manuela
    networks:
      - crm-network

  # ==========================================
  # Servidor Web & Reverse Proxy NGINX
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - crm-network

volumes:
  mysql_data:
    driver: local

networks:
  crm-network:
    driver: bridge
